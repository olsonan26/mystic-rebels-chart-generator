name: Verify chart generator
on: [push, pull_request]
jobs:
  astronomy-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m pytest astronomy_qa -q --junitxml=evidence/ci-astronomy.xml
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astronomical-validation
          path: |
            evidence/ci-astronomy.xml
            evidence/independent-astronomy.json
            data/ephemeris-manifest.json
