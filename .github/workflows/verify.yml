name: Verify chart generator
on: [push, pull_request]
jobs:
  astronomy-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-qa.txt
      - run: python -m pytest astronomy_qa access_qa -q --junitxml=evidence/ci-astronomy.xml
      - name: Reject incomplete required tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/ci-astronomy.xml').getroot()
          assert not root.findall('.//skipped'), 'Required tests skipped'
          PY
      - run: python scripts/methodology_regression.py
      - run: python scripts/knowledge_audit.py check
      - run: python scripts/knowledge_audit.py check-semantics
      - run: python scripts/knowledge_audit.py check-sources
      - run: python scripts/knowledge_audit.py check-requirements
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python scripts/check_nadia_boundary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astronomical-validation
          path: |
            evidence/ci-astronomy.xml
            evidence/independent-astronomy.json
            evidence/methodology-followup/regression.json
            evidence/astronomy-followup/
            data/ephemeris-manifest.json
            evidence/wheel-refinement/numerical-regression.json
            evidence/wheel-refinement/cross-platform-comparison.json
